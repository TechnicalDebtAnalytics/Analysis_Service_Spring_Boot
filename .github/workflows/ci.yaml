name: Analysis Service CI

on:
  push:
    branches:
      - main
      - develop
      -muditha/CloudAMQP

  pull_request:
    branches:
      - main
      - develop
      - muditha/CloudAMQP

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Build and run tests
        run: ./mvnw clean verify